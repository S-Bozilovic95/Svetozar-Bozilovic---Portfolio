<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svetozar Bozilovic - Frontend developer</title>
    <meta
      name="description"
      content="Frontend developer (React, TypeScript). Portfolio: Aylook ASC at Anteklab, Figma-to-code work at Zerox, and earlier projects."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Static copy of the contact form. Netlify reads it at deploy time to register the form. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
